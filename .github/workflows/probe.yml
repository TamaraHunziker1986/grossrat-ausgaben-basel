name: Erkundung Quellen (einmalig)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ldp-fdp/probe.py"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python ldp-fdp/probe.py
      - run: |
          git config user.name "grossrat-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ldp-fdp/proben
          git commit -m "Erkundung Quellen" || exit 0
          git pull --rebase -X theirs
          git push
